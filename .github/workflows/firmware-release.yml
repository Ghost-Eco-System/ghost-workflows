# Release of a Ghost firmware (GOS RFC-0008), called by the release.yml of a firmware repo on a
# tag vX.Y.Z or vX.Y.Z-rcN: build, checks, manifests completed, Sigstore keyless signature of
# each manifest, GitHub release (a pre-release for -rcN).
#
# The caller grants `contents: write` (the release, with its own GITHUB_TOKEN) and
# `id-token: write` (the OIDC identity that Sigstore certifies). No signing key exists.
# With `release-repo`, the release goes to `<caller>-releases` (no code there), written with a
# one-hour token of the releases App limited to that repository (RFC-0008 v0.2).
name: Firmware release

on:
  workflow_call:
    inputs:
      envs:
        description: PlatformIO environments to release, separated by spaces
        type: string
        required: true
      libraries:
        description: Private repos of Ghost-Eco-System the build reads (lib_deps), separated by commas
        type: string
        default: ''
      app-id:
        description: App ID of the Ghost CI App (vars.GHOST_CI_APP_ID), needed with `libraries`
        type: string
        default: ''
      local-core-tree:
        description: Clone the Ghost-Eco-System libraries of platformio.ini, at their pinned tags, to ../../../core/ghost-eco-system/ (envs that use the local Ghost tree, such as host tests)
        type: boolean
        default: false
      native-tests:
        description: Run `pio test -e native` before the build
        type: boolean
        default: true
      tools-ref:
        description: Ref of ghost-workflows that provides the release script (the same as the workflow)
        type: string
        default: v1
      release-repo:
        description: Publish the release in this repository instead of the caller's; it MUST be `<caller>-releases` of the same owner (RFC-0008 v0.2). Empty = the caller's repository
        type: string
        default: ''
      release-app-id:
        description: App ID of the App allowed to write releases to `release-repo` (vars.GHOST_RELEASES_APP_ID), needed with `release-repo`
        type: string
        default: ''
    secrets:
      GHOST_CI_PRIVATE_KEY:
        required: false
      GHOST_RELEASES_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Release repository is <caller>-releases of the same owner
        if: inputs.release-repo != ''
        env:
          TARGET: ${{ inputs.release-repo }}
        run: |
          if [ "${TARGET,,}" != "${GITHUB_REPOSITORY,,}-releases" ]; then
            echo "::error::release-repo must be ${GITHUB_REPOSITORY}-releases, not ${TARGET}"; exit 1
          fi

      - name: Token to read the private libraries (one hour, those repos only)
        if: inputs.libraries != ''
        id: libs
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.GHOST_CI_PRIVATE_KEY }}
          owner: Ghost-Eco-System
          repositories: ${{ inputs.libraries }}

      - name: lib_deps over SSH resolve with that token
        if: inputs.libraries != ''
        env:
          TOKEN: ${{ steps.libs.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Local Ghost tree at the pinned tags
        if: inputs.local-core-tree
        run: |
          root="$GITHUB_WORKSPACE/../../../core/ghost-eco-system"
          mkdir -p "$root"
          grep -oE 'git@github\.com:Ghost-Eco-System/[A-Za-z0-9._-]+\.git#[A-Za-z0-9._-]+' platformio.ini | sort -u |
          while IFS= read -r ref; do
            name=$(basename "${ref%%.git#*}"); tag="${ref##*#}"
            echo "$name at $tag"
            git clone -q --depth 1 --branch "$tag" "git@github.com:Ghost-Eco-System/$name.git" "$root/$name"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PlatformIO
        run: pip install platformio==6.2.0

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Host tests
        if: inputs.native-tests
        run: pio test -e native

      - name: Build
        env:
          ENVS: ${{ inputs.envs }}
        run: |
          rm -rf firmware/*.json firmware/*.hex firmware/*.bin
          for e in $ENVS; do pio run -e "$e"; done
          pio boards --json-output > "$RUNNER_TEMP/boards.json"

      - name: Release script
        uses: actions/checkout@v5
        with:
          repository: Ghost-Eco-System/ghost-workflows
          ref: ${{ inputs.tools-ref }}
          path: .ghost-workflows
          persist-credentials: false

      - name: Checks and manifests (RFC-0008)
        id: prepare
        run: >
          python .ghost-workflows/scripts/ghost_release.py
          --firmware firmware --ini platformio.ini --boards "$RUNNER_TEMP/boards.json"
          --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3

      - name: Sigstore keyless signature of each manifest
        env:
          MANIFESTS: ${{ steps.prepare.outputs.manifests }}
        run: |
          for m in $MANIFESTS; do
            cosign sign-blob --yes --new-bundle-format --bundle "${m%.json}.sigstore.json" "$m"
          done

      - name: Token to write the release repository (one hour, that repository only)
        if: inputs.release-repo != ''
        id: publisher
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.release-app-id }}
          private-key: ${{ secrets.GHOST_RELEASES_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}-releases

      - name: GitHub release
        if: inputs.release-repo == ''
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.prepare.outputs.files }}
          PRERELEASE: ${{ steps.prepare.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" $FILES firmware/*.sigstore.json \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Built and signed by ghost-workflows from ${GITHUB_SHA}. Manifest ghost-firmware/1 (GOS RFC-0008); one Sigstore bundle per manifest." \
            "${flags[@]}"

      - name: GitHub release in the release repository
        if: inputs.release-repo != ''
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          TARGET: ${{ inputs.release-repo }}
          FILES: ${{ steps.prepare.outputs.files }}
          PRERELEASE: ${{ steps.prepare.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" $FILES firmware/*.sigstore.json             --repo "$TARGET" --title "$GITHUB_REF_NAME"             --notes "Built and signed by ghost-workflows from ${GITHUB_REPOSITORY}@${GITHUB_SHA}. Manifest ghost-firmware/1 (GOS RFC-0008); one Sigstore bundle per manifest."             "${flags[@]}"
